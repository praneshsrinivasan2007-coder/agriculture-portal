<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="description" content="Simple random joke generator using the icanhazdadjoke API" />
  </head>
  <body>
    <main class="container">
      <h1>Random Joke Generator</h1>

      <div id="joke" class="joke">Click "New Joke" to fetch a joke.</div>

      <div class="controls">
        <button id="newJoke" class="btn">New Joke</button>
        <button id="tweet" class="btn btn--secondary">Share</button>
      </div>

      <p class="note">Powered by <a href="https://icanhazdadjoke.com/" target="_blank" rel="noopener">icanhazdadjoke.com</a></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
